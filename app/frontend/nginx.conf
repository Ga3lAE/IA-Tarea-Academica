server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Resolver DNS interno de Docker para evitar fallo al arrancar Nginx
    resolver 127.0.0.11 valid=30s;

    # API (FastAPI en el contenedor "api"): mismo origen, sin CORS.
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        set $upstream_health http://api:8000;
        proxy_pass $upstream_health/health;
    }

    # Archivos con hash: caché larga.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/, /encuesta) carga index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}