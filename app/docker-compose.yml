# Despliegue de la encuesta web: docker compose up -d --build  (desde la carpeta app/)
services:
  api:
    build:
      # Raíz del repo: la imagen copia src/*.py y models/winner_bundle.joblib (ver /.dockerignore)
      context: ..
      dockerfile: app/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
